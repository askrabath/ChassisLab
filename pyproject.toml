[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chassis-lab"
version = "0.1.0"
description = "VEX-inspired chassis generation and MuJoCo evaluation experiment"
requires-python = ">=3.11"
dependencies = ["mujoco>=3.3,<4", "pydantic>=2.10,<3", "numpy>=2,<3", "openai>=2,<4", "pillow>=10", "python-dotenv>=1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["chassis_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
